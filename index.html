<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>補貨建議計算器</title><style>

);color:#fff}button.secondary{background:#fff;border:1px solid var(--line);color:var(--ink)}@media(max-width:760px){.controls,.summary{grid-template-columns:1fr 1fr}h1{font-size:23px}}@media(max-width:460px){.controls,.summary{grid-template-columns:1fr}}
.tabs{display:flex;gap:8px;margin:18px 0}.tab{background:#fff;border:1px solid var(--line);color:var(--ink)}.tab.active{background:var(--accent);color:#fff}.page-title{margin:0 0 6px;font-size:22px}.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);background:#3d352f;color:#fff;padding:11px 20px;border-radius:999px;font-weight:700;box-shadow:0 8px 24px #0002;opacity:0;pointer-events:none;transition:.22s ease;z-index:9999}.toast.show{opacity:1;transform:translate(-50%,0)}</style></head><body><div class="wrap"><h1>📦 1688補貨建議計算器</h1><div class="sub">依近期銷速、現有庫存與到貨等待期，自動估算建議補貨數量。</div>
<div class="tabs"><button class="tab active" data-page="bowl" onclick="switchPage('bowl')">🐾 寵物高腳碗</button><button class="tab" data-page="bottle" onclick="switchPage('bottle')">🥤 胖胖水壺</button><button class="tab" data-page="marker" onclick="switchPage('marker')">🖍️ 丙烯馬克筆</button><button class="tab" data-page="oat" onclick="switchPage('oat')">🥣 燕麥杯</button><button class="tab" data-page="backpack" onclick="switchPage('backpack')">🎒 兒童小背包</button><button class="tab" data-page="wire" onclick="switchPage('wire')">🔌 電線保護套</button><button class="tab" data-page="velcro" onclick="switchPage('velcro')">🧷 魔鬼氈束帶</button></div>
<h2 class="page-title" id="pageTitle">寵物高腳碗</h2>
<div class="controls"><div class="box"><label>銷量統計天數</label><input id="period" type="number" value="45" min="1"></div><div class="box"><label>到貨等待天數（保守抓最慢）</label><input id="lead" type="number" value="21" min="0"></div><div class="box"><label>安全庫存天數</label><input id="safe" type="number" value="14" min="0"></div><div class="box"><label>最低補貨量（有需求時）</label><input id="minq" type="number" value="1" min="1"></div><div class="box"><label>一起補貨門檻（天）</label><input id="joinThreshold" type="number" value="40" min="0"></div><div class="box"><label>一起補貨目標天數</label><input id="joinTarget" type="number" value="49" min="0"></div></div>

<div class="note"><b>計算方式：</b>平均日銷量＝近 1.5 個月銷量 ÷ 45；安全庫存＝平均日銷量 × 14 天；一般建議補貨＝（平均日銷量 × 到貨天數）＋安全庫存－目前庫存，無條件進位。庫存可售天數介於一般補貨線（目前 35 天）與「一起補貨門檻」（預設 40 天）時，標示為「可一起補貨」，並補到「一起補貨目標天數」（預設 49 天）。近期銷量為 0 時預設不補貨。</div>

function data(){if(current==='bowl')return bowlRaw.map((r,i)=>[bowlCodes[i],`寵物高腳碗 - ${r[0]} - ${r[1]}號`,r[2],r[3]]);if(current==='bottle')return bottleRaw;if(current==='marker')return markerRaw;if(current==='oat')return oatRaw;if(current==='backpack')return backpackRaw;if(current==='wire')return wireRaw;return velcroRaw}
function draw(){let d=data();tb.innerHTML=d.map((r,i)=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td><input class="num sales" value="${r[2]}" type="number" min="0"></td><td><input class="num stock" value="${r[3]}" type="number" min="0"></td><td class="daily"></td><td class="days"></td><td class="qty"></td><td class="status"></td></tr>`).join('');document.querySelectorAll('.controls input').forEach(x=>x.addEventListener('input',calc));loadData();document.querySelectorAll('.sales,.stock').forEach(x=>x.addEventListener('input',()=>{calc();saveData()}));const salesInputs=[...document.querySelectorAll('.sales')];salesInputs.forEach((x,i)=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<salesInputs.length-1){salesInputs[i+1].focus();salesInputs[i+1].select()}}}));const stockInputs=[...document.querySelectorAll('.stock')];stockInputs.forEach((x,i)=>x.addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(i<stockInputs.length-1){stockInputs[i+1].focus();stockInputs[i+1].select()}}}));calc()}
function switchPage(p){current=p;document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.page===p));pageTitle.textContent=p==='bowl'?'寵物高腳碗':p==='bottle'?'胖胖水壺':p==='marker'?'丙烯馬克筆':p==='oat'?'燕麥杯':p==='backpack'?'兒童小背包':p==='wire'?'電線保護套':'魔鬼氈束帶';draw()}
function calc(){
let p=+period.value||45,l=+lead.value||0,s=+safe.value||0,m=+minq.value||1,target=l+s,
jt=+joinThreshold.value||0,jgoal=+joinTarget.value||target,T=0,S=0,R=0;
cover.textContent=target+' 天';
[...tb.rows].forEach(tr=>{
let sale=+tr.querySelector('.sales').value||0,st=+tr.querySelector('.stock').value||0,d=sale/p;
let days=d?st/d:Infinity;
let normalQ=sale===0?0:Math.max(0,Math.ceil(d*target-st));
let q=normalQ;
let label,cls;
if(sale===0){label='近期無銷量';cls='dead';q=0}
else if(days<l){label='高風險';cls='high';R++}
else if(days<target){label='建議補貨';cls='watch'}
else if(days<=jt){
 label='可一起補貨';cls='join';
 q=Math.max(0,Math.ceil(d*jgoal-st));
}else{label='庫存足夠';cls='enough';q=0}
if(q>0)q=Math.max(q,m);
tr.querySelector('.daily').textContent=d.toFixed(2);
tr.querySelector('.days').textContent=isFinite(days)?Math.round(days)+' 天':'—';
tr.querySelector('.qty').innerHTML=q?`<span class="need">${q}</span>`:`<span class="zero">0</span>`;
tr.querySelector('.status').innerHTML=`<span class="tag ${cls}">${label}</span>`;
T+=q;if(q)S++
});
total.textContent=T;skus.textContent=S;risk.textContent=R
}

function printInventory(){
  const rows=data();
  const title=pageTitle.textContent+'｜盤點單';
  const esc=v=>String(v).replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const body=rows.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r[0])}</td><td class="name">${esc(r[1])}</td><td class="count"></td></tr>`).join('');
  const w=window.open('','_blank');
  if(!w){alert('瀏覽器阻擋了列印視窗，請允許此網頁開啟彈出式視窗後再試一次。');return;}
  w.document.write(`<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><title>${esc(title)}</title><style>
    @page{size:A4;margin:12mm}*{box-sizing:border-box}body{font-family:system-ui,-apple-system,"Segoe UI","Noto Sans TC",sans-serif;color:#222;margin:0}h1{font-size:22px;margin:0 0 6px;text-align:center}.meta{font-size:12px;margin:0 0 12px;text-align:right;color:#555}table{width:100%;border-collapse:collapse;table-layout:fixed}th,td{border:1px solid #555;padding:8px 7px;font-size:12px;height:36px}th{background:#f3f3f3;text-align:center}th:nth-child(1),td:nth-child(1){width:8%;text-align:center}th:nth-child(2),td:nth-child(2){width:22%;text-align:center}th:nth-child(3),td:nth-child(3){width:50%}.name{text-align:left}th:nth-child(4),td:nth-child(4){width:20%}.count{height:38px}thead{display:table-header-group}tr{page-break-inside:avoid}@media print{.no-print{display:none}}
  </style></head><body><h1>${esc(title)}</h1><div class="meta">列印日期：${new Date().toLocaleDateString('zh-TW')}</div><table><thead><tr><th>序號</th><th>品號</th><th>品名</th><th>盤點數量</th></tr></thead><tbody>${body}</tbody></table><script>window.onload=()=>{setTimeout(()=>window.print(),150)}<\/script></body></html>`);
  w.document.close();
}

function copyList(){calc();let a=[];[...tb.rows].forEach(tr=>{let q=+tr.querySelector('.qty').innerText||0;if(q)a.push(`${tr.cells[0].innerText}｜${tr.cells[1].innerText} × ${q}`)});navigator.clipboard.writeText(a.length?`【${pageTitle.textContent}補貨建議】\n`+a.join('\n'):'目前無需補貨').then(()=>showToast())}
function showToast(){toast.classList.add('show');clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>toast.classList.remove('show'),1500)}
function saveData(){
  const saved=JSON.parse(localStorage.getItem('restockCalculatorData')||'{}');
  saved[current]=[...tb.rows].map(tr=>({
    sales:+tr.querySelector('.sales').value||0,
    stock:+tr.querySelector('.stock').value||0
  }));
  localStorage.setItem('restockCalculatorData',JSON.stringify(saved));
}
function loadData(){
  const saved=JSON.parse(localStorage.getItem('restockCalculatorData')||'{}');
  const rows=saved[current];
  if(!rows)return;
  [...tb.rows].forEach((tr,i)=>{
    if(!rows[i])return;
    tr.querySelector('.sales').value=rows[i].sales??0;
    tr.querySelector('.stock').value=rows[i].stock??0;
  });
}
function resetData(){
  [...tb.rows].forEach(tr=>{
    tr.querySelector('.sales').value=0;
    tr.querySelector('.stock').value=0;
  });
  saveData();
  calc();
}
draw();
</script></body></html>
